<div class="kiosk-content">
  @if (statusMessage) {
    <div class="status-alert" [class.danger]="statusTone === 'danger'" role="alert">
      <span class="status-alert-dot"></span>{{ statusMessage }}
    </div>
  }
  @if (loading) {
    <div class="loading-overlay">
      <ion-spinner name="crescent" color="light"></ion-spinner>
    </div>
  }

  @if (useIframeFallback) {
    <div class="preview-badge">Browser preview · Native kiosk WebView activates on Android</div>
    <iframe
      #kioskFrame
      class="kiosk-frame"
      [src]="safeUrl"
      (load)="onFrameLoad()"
      allow="autoplay; fullscreen"
    ></iframe>
  }
</div>
